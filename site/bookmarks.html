<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>书签 — pitboard</title><link rel="stylesheet" href="/styles.css"></head>
<body><nav class="nav"><div class="nav-inner"><a class="brand" href="/">⏱ pitboard</a>
<div class="nav-links"><a href="/">今日</a><a href="/topics/">话题</a><a href="/archive.html">归档</a><a href="/about.html">关于</a><a href="/rss.xml">RSS</a></div></div></nav>
<main><section class="hero hero-slim"><p class="kicker">BOOKMARKS</p><h1 class="hero-date hero-date-s">我的书签</h1>
<p class="hero-meta">保存在本机浏览器 · <button class="tab" id="exp">导出 JSON</button>
<label class="tab" style="cursor:pointer">导入 JSON<input id="imp" type="file" accept=".json" style="display:none"></label>
<button class="tab" id="clr">清空</button></p>
</section><ul class="archive-list" id="list"></ul>
<script>
var KEY="pitboard-bookmarks";
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}}
function save(l){try{localStorage.setItem(KEY,JSON.stringify(l))}catch(e){}}
function render(){var l=load(),R=document.getElementById("list");R.innerHTML="";
if(!l.length){R.innerHTML='<li class="topic-row"><span class="src-dom">还没有书签——在今日榜卡片上点 ☆ 收藏</span></li>';return}
l.forEach(function(m){var li=document.createElement("li");li.className="topic-row";
li.innerHTML='<span class="topic-date">'+(m.d||"")+'</span><a href="'+m.u+'" target="_blank" rel="noopener">'+m.t+'</a><span class="src-dom">移除</span>';
li.querySelector(".src-dom").style.cursor="pointer";
li.querySelector(".src-dom").addEventListener("click",function(){save(load().filter(function(x){return x.u!==m.u}));render()});
R.appendChild(li)})}
document.getElementById("clr").addEventListener("click",function(){save([]);render()});
document.getElementById("exp").addEventListener("click",function(){
var blob=new Blob([JSON.stringify(load(),null,2)],{type:"application/json"});
var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="pitboard-bookmarks.json";a.click()});
document.getElementById("imp").addEventListener("change",function(ev){
var f=ev.target.files[0];if(!f)return;var r=new FileReader();
r.onload=function(){try{var inc=JSON.parse(r.result);var l=load();
inc.forEach(function(m){if(m&&m.u&&!l.some(function(x){return x.u===m.u}))l.push(m)});
save(l);render()}catch(e){alert("导入失败：不是有效的书签 JSON")}};
r.readAsText(f)});
render();
</script></main></body></html>
