name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Keep every main push CI run; only superseded runs of the same PR are
# cancelled. Separate event types and PR numbers to avoid collisions.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Install dependencies
        run: raco pkg install --auto --no-docs http-easy server-sent-events feed
      - name: Install package
        run: raco pkg install --auto --no-docs --link "$(pwd)"
      - name: Run tests
        run: raco test -p pitboard
      - name: Compile the web app
        run: raco make pitboard/app.rkt
