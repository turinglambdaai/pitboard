name: Digest

# Daily edition: fetch sources, score, cluster, commit the archive and
# regenerate the static mirror in site/ (which triggers the Pages deploy).

on:
  schedule:
    - cron: '30 23 * * *'   # 07:30 Beijing time
  workflow_dispatch:

concurrency:
  group: digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Install dependencies
        run: raco pkg install --auto --no-docs http-easy server-sent-events feed
      - name: Install pitboard
        run: raco pkg install --auto --no-docs --link "$(pwd)"
      - name: Fetch and publish today's edition
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PITBOARD_LLM_API_KEY: ${{ secrets.PITBOARD_LLM_API_KEY }}
          PITBOARD_LLM_BASE_URL: ${{ secrets.PITBOARD_LLM_BASE_URL }}
          PITBOARD_LLM_MODEL: ${{ secrets.PITBOARD_LLM_MODEL }}
        run: raco pitboard fetch --data data --config config/sources.json
      - name: Export static mirror
        run: raco pitboard export --data data --out site --domain pitboard.jrtx.site
      - name: Leak sweep (unresolved template artifacts)
        run: |
          python3 - <<'EOF'
          import re, pathlib
          from html.entities import html5
          # Named HTML entities in syndicated content are valid output, not
          # unresolved template artifacts (e.g. &uuml; in a headline).
          allow = {name[:-1] for name in html5 if name.endswith(";")}
          pat = re.compile(r"<unquote|~[asv]|&([a-zA-Z][a-zA-Z0-9]+);")
          bad = []
          for p in sorted(pathlib.Path("site").rglob("*")):
              if p.suffix in {".html", ".xml", ".md", ".txt", ".svg"}:
                  text = p.read_text(encoding="utf-8")
                  for m in pat.finditer(text):
                      if m.group(1) and m.group(1) in allow:
                          continue
                      bad.append(f"{p}: {m.group(0)!r}")
          if bad:
              print("\n".join(bad))
              raise SystemExit(1)
          print(f"leak sweep clean")
          EOF
      - name: Commit the archive
        run: |
          git config user.name "pitboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data site
          git commit -m "digest: $(date -u +%F) [skip ci]" || echo "no changes"
          git push
